name: FitCore Trust CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fitcore-trust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Project structure and PostgreSQL promotion contract
        run: npm run check:project
      - name: VIDEIRA TRUST GATE v1
        run: npm run trust:gate
