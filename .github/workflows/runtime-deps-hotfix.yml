name: Runtime dependency hotfix

on:
  push:
    branches:
      - security/runtime-deps-20261006

permissions:
  contents: write

jobs:
  update:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/runtime-deps-20261006
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - name: Update patched runtime dependencies
        run: |
          npm --prefix apps/site install --save-exact next@16.4.0
          npm --prefix apps/site audit fix --omit=dev
      - name: Runtime security audit
        run: npm --prefix apps/site audit --omit=dev --audit-level=high
      - name: Record reproducible lockfile and remove bootstrap workflow
        run: |
          rm -f .github/workflows/runtime-deps-hotfix.yml
          git config user.name "videira-security-bot"
          git config user.email "148473770+Videirafo@users.noreply.github.com"
          git add apps/site/package.json apps/site/package-lock.json .github/workflows/runtime-deps-hotfix.yml
          git diff --cached --exit-code && exit 1 || true
          git commit -m "security: patch FitCore runtime dependencies"
          git push origin HEAD:security/runtime-deps-20261006
