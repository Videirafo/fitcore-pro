name: FitCore CI

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fitcore-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'push' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner
      )
    runs-on: [self-hosted, Linux, X64, fitcore-vps]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/site/package-lock.json
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund
      - name: Install site dependencies
        run: npm --prefix apps/site ci --no-audit --no-fund
      - name: Project structure
        run: npm run check:project
      - name: Security Baseline v1
        run: npm run security:check
      - name: Execution kernel contract
        run: npm run execution:check
      - name: Ensure PostgreSQL client
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: P0 real product E2E (PostgreSQL 17.6)
        run: npm run p0:real:e2e
      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium
      - name: Browser E2E (real human flow)
        run: npm run e2e:browser
      - name: UI and contract gates
        run: npm run all:ui-gates
      - name: Mobile foundation contract
        run: npm run mvp44:check
      - name: Mobile release contract
        run: npm run mvp46:check
      - name: Runtime dependency audit
        run: npm --prefix apps/site audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run site:next:build
