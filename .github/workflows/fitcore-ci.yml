name: FitCore CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fitcore-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - name: Install site dependencies
        run: npm --prefix apps/site ci --no-audit --no-fund
      - name: Project structure
        run: npm run check:project
      - name: UI and contract gates
        run: npm run all:ui-gates
      - name: Mobile foundation contract
        run: npm run mvp44:check
      - name: Mobile release contract
        run: npm run mvp46:check
      - name: Runtime dependency audit
        run: npm --prefix apps/site audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run site:next:build
